<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 16px;
    background: #eef2f5;
    color: #2d3748;
  }
  .card {
    background: #fff;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    max-width: 420px;
    margin: 40px auto;
  }
  h2 { margin-top: 0; color: #1a365d; font-size: 20px; text-align: center; }
  p.sub { text-align: center; color: #718096; font-size: 13px; margin-top: -8px; margin-bottom: 20px; }
  label { font-weight: 600; margin-top: 14px; display: block; font-size: 13px; color: #4a5568; }
  input, select, textarea {
    width: 100%;
    padding: 11px;
    margin-top: 4px;
    border: 1px solid #cbd5e0;
    border-radius: 6px;
    font-size: 15px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; }
  button {
    background: #2b6cb0;
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-top: 18px;
  }
  button:disabled { background: #a0aec0; cursor: not-allowed; }
  button.secondary { background: #718096; margin-top: 8px; }
  .alert {
    padding: 12px;
    border-radius: 6px;
    text-align: center;
    margin-top: 14px;
    font-weight: 600;
    font-size: 14px;
  }
  .error { background: #fed7d7; color: #9b2c2c; }
  .success { background: #c6f6d5; color: #22543d; }
  .hidden { display: none !important; }
  .userbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 13px;
    color: #4a5568;
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="card" id="loginSection">
  <h2>NGAPORI RANCH</h2>
  <p class="sub">Ranch Asset & Maintenance OS (RAMS)</p>

  <label for="username">Username</label>
  <input type="text" id="username" autocomplete="username" autocapitalize="none">

  <label for="pin">PIN</label>
  <input type="password" id="pin" inputmode="numeric" autocomplete="current-password">

  <button id="loginBtn" onclick="login()">Log In</button>
  <div id="loginError" class="alert error hidden"></div>
</div>

<!-- DATA ENTRY -->
<div class="card hidden" id="entrySection">
  <div class="userbar">
    <span id="whoami"></span>
    <a href="#" onclick="logout(); return false;">Log out</a>
  </div>
  <h2>Field Report</h2>

  <label for="assetId">Asset ID</label>
  <input type="text" id="assetId" placeholder="e.g. TR-014">

  <label for="workType">Work Type</label>
  <select id="workType">
    <option value="Routine">Routine</option>
    <option value="Repair">Repair</option>
    <option value="Damage">Damage</option>
    <option value="Inspection">Inspection</option>
  </select>

  <label for="description">Description</label>
  <textarea id="description" placeholder="What was done / observed"></textarea>

  <label for="partsUsed">Parts Used (optional)</label>
  <input type="text" id="partsUsed" placeholder="e.g. hydraulic hose">

  <label for="quantity">Quantity (optional)</label>
  <input type="number" id="quantity" min="0" step="1">

  <button id="submitBtn" onclick="submitReport()">Submit Report</button>
  <div id="entryMsg" class="alert hidden"></div>
</div>

<script>
  var activeUser = null;

  // ---------- AUTH ----------
  function login() {
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('pin').value.trim();
    var btn = document.getElementById('loginBtn');
    var errEl = document.getElementById('loginError');

    if (!u || !p) {
      errEl.innerText = 'Enter both username and PIN.';
      errEl.classList.remove('hidden');
      return;
    }

    errEl.classList.add('hidden');
    btn.disabled = true;
    btn.innerText = 'Logging in...';

    google.script.run
      .withSuccessHandler(function (user) {
        btn.disabled = false;
        btn.innerText = 'Log In';
        if (!user) {
          errEl.innerText = 'Invalid username or PIN.';
          errEl.classList.remove('hidden');
          return;
        }
        activeUser = user;
        document.getElementById('whoami').innerText = user.name + ' (' + user.role + ')';
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('entrySection').classList.remove('hidden');
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.innerText = 'Log In';
        errEl.innerText = 'Server error: ' + (err && err.message ? err.message : err);
        errEl.classList.remove('hidden');
      })
      .authenticateUser(u, p);
  }

  function logout() {
    activeUser = null;
    document.getElementById('username').value = '';
    document.getElementById('pin').value = '';
    document.getElementById('entrySection').classList.add('hidden');
    document.getElementById('loginSection').classList.remove('hidden');
  }

  // ---------- DATA ENTRY ----------
  function submitReport() {
    if (!activeUser) { logout(); return; }

    var assetId = document.getElementById('assetId').value.trim();
    var description = document.getElementById('description').value.trim();
    var msgEl = document.getElementById('entryMsg');
    var btn = document.getElementById('submitBtn');

    if (!assetId || !description) {
      msgEl.className = 'alert error';
      msgEl.innerText = 'Asset ID and Description are required.';
      msgEl.classList.remove('hidden');
      return;
    }

    var payload = {
      username: activeUser.username,
      role: activeUser.role,
      assetId: assetId,
      workType: document.getElementById('workType').value,
      description: description,
      partsUsed: document.getElementById('partsUsed').value.trim(),
      quantity: document.getElementById('quantity').value
    };

    msgEl.classList.add('hidden');
    btn.disabled = true;
    btn.innerText = 'Submitting...';

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.innerText = 'Submit Report';
        msgEl.className = 'alert success';
        msgEl.innerText = 'Submitted: ' + result.logId;
        msgEl.classList.remove('hidden');
        document.getElementById('assetId').value = '';
        document.getElementById('description').value = '';
        document.getElementById('partsUsed').value = '';
        document.getElementById('quantity').value = '';
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.innerText = 'Submit Report';
        msgEl.className = 'alert error';
        msgEl.innerText = 'Server error: ' + (err && err.message ? err.message : err);
        msgEl.classList.remove('hidden');
      })
      .processSignedFieldReport(payload);
  }
</script>
</body>
</html>
