<!--
  Index.html — paste this in as a separate HTML file in the same Apps Script
  project (File -> New -> HTML file -> name it "Index"). Referenced by
  doGet() in the .gs file via HtmlService.createTemplateFromFile("Index").
-->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background: #0f172a; color: #f8fafc; }
      .card { background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; max-width: 440px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
      h2 { margin-top: 0; color: #38bdf8; font-size: 22px; text-align: center; }
      label { font-weight: 600; margin-top: 14px; display: block; font-size: 13px; color: #94a3b8; }
      input, select, textarea { width: 100%; padding: 12px; margin-top: 6px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; box-sizing: border-box; font-size: 15px; }
      input:focus, select:focus, textarea:focus { border-color: #38bdf8; outline: none; }
      button { background: #0284c7; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; margin-top: 20px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
      button:hover { background: #0369a1; }
      button:disabled { background: #475569; cursor: not-allowed; }
      .hidden { display: none; }
      .alert { padding: 12px; border-radius: 8px; text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; }
      .error { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
      .success { background: #14532d; color: #86efac; border: 1px solid #166534; }
      .user-badge { background: #0369a1; color: #e0f2fe; padding: 8px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 18px; }
      .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
      .kpi-box { background: #0f172a; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
      .kpi-val { font-size: 20px; font-weight: bold; color: #38bdf8; }
      .kpi-lbl { font-size: 11px; color: #94a3b8; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>NGAPORI RAMS OS</h2>

      <!-- AUTHENTICATION SCREEN -->
      <div id="loginSection">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username">

        <label>PIN / Password</label>
        <input type="password" id="pin" placeholder="****">

        <button type="button" onclick="login()">Authenticate System</button>
        <div id="loginError" class="alert error hidden">Invalid credentials.</div>
      </div>

      <!-- RANCH WORKER INTERFACE -->
      <div id="workerSection" class="hidden">
        <div id="workerBadge" class="user-badge"></div>
        <form id="ramsWorkerForm">
          <label>Asset ID</label>
          <input type="text" id="assetId" value="<?= assetId ?>" required placeholder="e.g. TRAC-01">

          <label>Report Classification</label>
          <select id="workType" required>
            <? for (var i = 0; i < workTypes.length; i++) { ?>
              <option value="<?= workTypes[i] ?>"><?= workTypes[i] ?></option>
            <? } ?>
          </select>

          <label>Field Observations / Notes</label>
          <textarea id="description" rows="3" placeholder="Log details..." required></textarea>

          <button type="button" id="submitWorkerBtn" onclick="submitWorkerReport()">Submit Signed Report</button>
        </form>
        <div id="workerMsg" class="alert hidden"></div>
      </div>

      <!-- FOUNDER / EXECUTIVE DASHBOARD -->
      <div id="founderSection" class="hidden">
        <div id="founderBadge" class="user-badge"></div>
        <div class="kpi-grid">
          <div class="kpi-box"><div class="kpi-val" id="kpiOps">-</div><div class="kpi-lbl">Operational</div></div>
          <div class="kpi-box"><div class="kpi-val" id="kpiOoo" style="color:#f87171;">-</div><div class="kpi-lbl">Out of Order</div></div>
          <div class="kpi-box"><div class="kpi-val" id="kpiOverdue" style="color:#fbbf24;">-</div><div class="kpi-lbl">Overdue Service</div></div>
          <div class="kpi-box"><div class="kpi-val" id="kpiLowParts" style="color:#fbbf24;">-</div><div class="kpi-lbl">Low Parts Alerts</div></div>
          <div class="kpi-box"><div class="kpi-val" id="kpiBasis">-</div><div class="kpi-lbl">Asset Basis ($)</div></div>
          <div class="kpi-box"><div class="kpi-val" id="kpiCapex">-</div><div class="kpi-lbl">Planned CAPEX ($)</div></div>
        </div>
        <p style="font-size:12px; text-align:center; color:#94a3b8;">Full detail available in the spreadsheet database.</p>
      </div>
    </div>

    <script>
      var activeUser = null;

      function login() {
        var u = document.getElementById('username').value.trim();
        var p = document.getElementById('pin').value.trim();

        google.script.run
          .withSuccessHandler(function (user) {
            if (user) {
              activeUser = user;
              document.getElementById('loginSection').classList.add('hidden');

              if (user.role === "Executive") {
                document.getElementById('founderSection').classList.remove('hidden');
                document.getElementById('founderBadge').innerText = "Logged in: " + user.name + " (Founder)";
                loadDashboardMetrics();
              } else {
                document.getElementById('workerSection').classList.remove('hidden');
                document.getElementById('workerBadge').innerText = "Logged in: " + user.name + " (" + user.role + ")";
              }
            } else {
              document.getElementById('loginError').classList.remove('hidden');
            }
          })
          .withFailureHandler(function () {
            document.getElementById('loginError').classList.remove('hidden');
          })
          .authenticateUser(u, p);
      }

      function submitWorkerReport() {
        var btn = document.getElementById('submitWorkerBtn');
        btn.disabled = true;
        btn.innerText = "Signing & Submitting...";

        var payload = {
          username: activeUser.name,
          role: activeUser.role,
          assetId: document.getElementById('assetId').value,
          workType: document.getElementById('workType').value,
          description: document.getElementById('description').value
        };

        google.script.run
          .withSuccessHandler(function () {
            document.getElementById('ramsWorkerForm').reset();
            var msg = document.getElementById('workerMsg');
            msg.className = "alert success";
            msg.innerText = "Report signed & logged to RAMS!";
            msg.classList.remove('hidden');
            btn.disabled = false;
            btn.innerText = "Submit Signed Report";
            setTimeout(function () { msg.classList.add('hidden'); }, 4000);
          })
          .withFailureHandler(function (err) {
            var msg = document.getElementById('workerMsg');
            msg.className = "alert error";
            msg.innerText = "Submission failed: " + err.message;
            msg.classList.remove('hidden');
            btn.disabled = false;
            btn.innerText = "Submit Signed Report";
          })
          .processSignedFieldReport(payload);
      }

      function loadDashboardMetrics() {
        google.script.run
          .withSuccessHandler(function (kpis) {
            document.getElementById('kpiOps').innerText = kpis.operational;
            document.getElementById('kpiOoo').innerText = kpis.outOfOrder;
            document.getElementById('kpiOverdue').innerText = kpis.overdueService;
            document.getElementById('kpiLowParts').innerText = kpis.lowPartsAlerts;
            document.getElementById('kpiBasis').innerText = "$" + Number(kpis.assetBasis).toLocaleString();
            document.getElementById('kpiCapex').innerText = "$" + Number(kpis.plannedCapex).toLocaleString();
          })
          .getDashboardData();
      }
    </script>
  </body>
</html>
